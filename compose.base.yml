services:
  app-base:
    # The server shuts itself down after IDLE_TIMEOUT_SECONDS of inactivity to
    # free VRAM; restart it so the next request brings it back (lazy load).
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BACKEND: ${BACKEND:-cuda}     # or cpu
        UV_VERSION: ${UV_VERSION:-0.8.15}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./references:/app/references
      # rtf.log and friends land here; without the mount they sit on the
      # container's ephemeral layer and vanish on `down`.
      - ./logs:/app/logs
    environment:
      COMPILE: ${COMPILE:-0}
    # GPU (remove this block if CPU-only):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
